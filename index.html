                    <meta name="Generator" content="Cocoa HTML Writer">

                            <link rel="preconnect" href="https://fonts.googleapis.com">

                            <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
                            <style type="text/css">
                                :root{
                                    --bg:#0a0a10; --bg2:#1a0a0f; --panel:#15121a; --panel2:#130f18;
                                    --text:#f5f1ec; --muted:#a99aa3; --line:rgba(255,255,255,.12);

                                    --pokedex-red:#e3350d; --pokedex-red-dark:#a8240a; --pokedex-red-light:#ff5b3d;
                                    --gold:#ffcf5c; --gold-dark:#b8860b;
                                    --chrome:#c7cad3;

                                    --accent:var(--pokedex-red); --accent2:var(--gold);
                                    --warn:#f59e0b; --ok:#3ddc84; --danger:#ef4444;

                                    --type-normal:#A8A878; --type-fire:#F08030; --type-water:#6890F0; --type-electric:#F0C020;
                                    --type-grass:#78C850; --type-ice:#98D8D8; --type-fighting:#C03028; --type-poison:#A040A0;
                                    --type-ground:#E0C068; --type-flying:#A890F0; --type-psychic:#F85888; --type-bug:#A8B820;
                                    --type-rock:#B8A038; --type-ghost:#705898; --type-dragon:#7038F8; --type-dark:#8a7568;
                                    --type-steel:#B8B8D0; --type-fairy:#EE99AC;

                                    --display-font:'Titan One', system-ui, -apple-system, sans-serif;
                                }
                                html,body{height:100%}
                                html{-webkit-text-size-adjust:100%;min-height:100%;
                                    background:
                                        radial-gradient(circle at 50% -10%, rgba(227,53,13,.22), transparent 55%),
                                        radial-gradient(circle at 100% 100%, rgba(255,207,92,.07), transparent 45%),
                                        linear-gradient(180deg,var(--bg),var(--bg2));
                                    background-attachment:fixed;
                                }
                                body{margin:0;background:transparent;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;font-size:clamp(14px,1.8vw,16px)}
                                
                                .wrap{max-width:1100px;margin:24px auto;padding:16px}

                                /* Pokédex-style header banner */
                                .pokedex-header{
                                    display:flex;align-items:center;gap:14px;
                                    background:linear-gradient(155deg,var(--pokedex-red-light),var(--pokedex-red) 55%,var(--pokedex-red-dark));
                                    border:1px solid rgba(0,0,0,.45);
                                    border-radius:18px;
                                    padding:14px 18px;
                                    margin-top:10px;
                                    box-shadow:0 14px 34px rgba(227,53,13,.32), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -4px 0 rgba(0,0,0,.28);
                                    position:relative;
                                    overflow:hidden;
                                }
                                .pokedex-header::after{
                                    content:"";
                                    position:absolute; inset:0;
                                    background:linear-gradient(115deg, rgba(255,255,255,.18) 0%, transparent 30%);
                                    pointer-events:none;
                                }
                                .pokedex-lights{display:flex;align-items:center;gap:8px;flex-shrink:0}
                                .light{border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 3px rgba(0,0,0,.45), 0 0 8px rgba(255,255,255,.4)}
                                .light-main{width:28px;height:28px;background:radial-gradient(circle at 35% 30%, #dff3ff, #4aa3ff 55%, #16467f);border:3px solid rgba(255,255,255,.85)}
                                .light-red{width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#fff,#ff5b5b 55%,#8a1c07);border:1px solid rgba(0,0,0,.3)}
                                .light-yellow{width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#fff,#ffe066 55%,#a67c00);border:1px solid rgba(0,0,0,.3)}
                                .light-green{width:9px;height:9px;background:radial-gradient(circle at 35% 30%,#fff,#7CFC7C 55%,#1c6b1c);border:1px solid rgba(0,0,0,.3)}
                                .app-title{
                                    font-family:var(--display-font);
                                    color:#fff;
                                    font-size:clamp(20px,3.6vw,30px);
                                    letter-spacing:.5px;
                                    text-shadow:0 2px 0 rgba(0,0,0,.4), 0 0 20px rgba(255,255,255,.2);
                                    margin:0;
                                    display:flex;align-items:center;gap:10px;
                                }
                                .pokeball-icon{
                                    width:26px;height:26px;flex-shrink:0;border-radius:50%;
                                    background:
                                        radial-gradient(circle at 50% 50%, #fff 0 16%, #111 16% 21%, transparent 21%),
                                        linear-gradient(#ff5b3d 0 48%, #111 48% 52%, #fff 52% 100%);
                                    border:2px solid #111;
                                    box-shadow:0 2px 6px rgba(0,0,0,.4);
                                }

                                .section-title{
                                    margin:8px 0 10px;
                                    font-family:var(--display-font);
                                    font-weight:400;
                                    letter-spacing:.3px;
                                    font-size:15px;
                                    display:flex;align-items:center;gap:8px;
                                }
                                .section-title::before{
                                    content:"";
                                    width:8px;height:8px;border-radius:2px;
                                    background:var(--pokedex-red);
                                    box-shadow:0 0 8px rgba(227,53,13,.7);
                                    flex-shrink:0;
                                }

                                .card{
                                    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)) , var(--panel);
                                    border:1px solid var(--line);
                                    border-top:3px solid var(--pokedex-red);
                                    border-radius:16px;
                                    padding:14px;
                                    box-shadow:0 14px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
                                }

                                #filters.card{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
                                
                                .label{font-weight:600}
                                .muted{color:var(--muted)}

                                /* Utility layout helpers */
                                .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
                                .check{display:flex;align-items:center;gap:6px}

                                /* --- NEW CARD LAYOUT START --- */
                                
                                /* 1. The Button Container */
                                .choice-card {
                                    appearance: none;
                                    -webkit-appearance: none;
                                    border: 1px solid var(--line);
                                    border-radius: 12px;
                                    background: linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
                                    cursor: pointer;
                                    color: inherit;
                                    font: inherit;
                                    touch-action: manipulation;
                                    
                                    /* Layout Reset */
                                    display: block;
                                    width: 100%;
                                    min-height: 180px; /* Ensure enough height for everything */
                                    padding: 0; /* IMPORTANT: No padding here, let the inner card handle it */
                                    overflow: hidden;
                                    position: relative;
                                }

                                .choice-card:focus-visible {
                                    outline: 2px solid var(--accent);
                                    outline-offset: 2px;
                                }

                                /* 2. The Inner Card Content */
                                .poke-card {
                                    width: 100%;
                                    height: 100%;
                                    position: relative;
                                    
                                    display: flex;
                                    flex-direction: column;
                                    align-items: center;
                                    justify-content: center; /* Vertically center the image group */
                                    
                                    padding: 10px;
                                    padding-bottom: 35px; /* Reserve space for types at bottom */
                                    box-sizing: border-box;
                                }

                                /* 3. The Image */
                                .poke-img {
                                    width: auto;
                                    height: auto;
                                    max-height: 110px; /* Limit height so it fits */
                                    max-width: 100%;
                                    object-fit: contain;
                                    flex-shrink: 1;
                                    display: block;
                                    filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
                                }

                                /* 4. The Name */
                                .poke-name {
                                    font-weight: 700;
                                    text-transform: capitalize;
                                    text-align: center;
                                    margin-top: 8px;
                                    line-height: 1.2;
                                    z-index: 2;
                                }

                                /* 5. The Types (Pinned to Bottom) */
                                .poke-types {
                                    position: absolute;
                                    bottom: 8px; /* Stick to bottom of button */
                                    left: 0;
                                    right: 0;
                                    
                                    display: flex;
                                    gap: 5px;
                                    justify-content: center;
                                    pointer-events: none;
                                }

                                .type-icon {
                                    height: 18px;
                                    width: auto;
                                    object-fit: contain;
                                }

                                /* 6. Per-type glow ring — subtle tint matching the Pokémon's primary type */
                                .poke-card[data-type]{
                                    border-radius:12px;
                                    border:2px solid var(--type-accent, var(--line));
                                    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 0 22px 2px var(--type-glow, transparent);
                                }
                                .poke-card[data-type="normal"]{--type-accent:var(--type-normal);--type-glow:rgba(168,168,120,.35)}
                                .poke-card[data-type="fire"]{--type-accent:var(--type-fire);--type-glow:rgba(240,128,48,.4)}
                                .poke-card[data-type="water"]{--type-accent:var(--type-water);--type-glow:rgba(104,144,240,.4)}
                                .poke-card[data-type="electric"]{--type-accent:var(--type-electric);--type-glow:rgba(240,192,32,.4)}
                                .poke-card[data-type="grass"]{--type-accent:var(--type-grass);--type-glow:rgba(120,200,80,.4)}
                                .poke-card[data-type="ice"]{--type-accent:var(--type-ice);--type-glow:rgba(152,216,216,.4)}
                                .poke-card[data-type="fighting"]{--type-accent:var(--type-fighting);--type-glow:rgba(192,48,40,.4)}
                                .poke-card[data-type="poison"]{--type-accent:var(--type-poison);--type-glow:rgba(160,64,160,.4)}
                                .poke-card[data-type="ground"]{--type-accent:var(--type-ground);--type-glow:rgba(224,192,104,.4)}
                                .poke-card[data-type="flying"]{--type-accent:var(--type-flying);--type-glow:rgba(168,144,240,.4)}
                                .poke-card[data-type="psychic"]{--type-accent:var(--type-psychic);--type-glow:rgba(248,88,136,.4)}
                                .poke-card[data-type="bug"]{--type-accent:var(--type-bug);--type-glow:rgba(168,184,32,.4)}
                                .poke-card[data-type="rock"]{--type-accent:var(--type-rock);--type-glow:rgba(184,160,56,.4)}
                                .poke-card[data-type="ghost"]{--type-accent:var(--type-ghost);--type-glow:rgba(112,88,152,.4)}
                                .poke-card[data-type="dragon"]{--type-accent:var(--type-dragon);--type-glow:rgba(112,56,248,.4)}
                                .poke-card[data-type="dark"]{--type-accent:var(--type-dark);--type-glow:rgba(138,117,104,.4)}
                                .poke-card[data-type="steel"]{--type-accent:var(--type-steel);--type-glow:rgba(184,184,208,.4)}
                                .poke-card[data-type="fairy"]{--type-accent:var(--type-fairy);--type-glow:rgba(238,153,172,.4)}

                                /* --- NEW CARD LAYOUT END --- */
                                
                                .btn{
                                    appearance:none;border:1px solid rgba(0,0,0,.35);
                                    background:linear-gradient(180deg,var(--pokedex-red-light),var(--pokedex-red) 55%, var(--pokedex-red-dark));
                                    color:#fff;
                                    font-family:var(--display-font);font-weight:400;letter-spacing:.3px;
                                    padding:10px 16px;border-radius:999px;cursor:pointer;
                                    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
                                    box-shadow:0 6px 16px rgba(227,53,13,.35), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25);
                                }
                                .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
                                .btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.35)}
                                .btn.secondary{
                                    background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
                                    color:var(--text);
                                    border:1px solid var(--chrome);
                                    box-shadow:0 2px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
                                }
                                .btn.special{
                                    background:linear-gradient(180deg,#ffe28a,var(--gold) 55%, var(--gold-dark));
                                    color:#3a2900;
                                    border:1px solid rgba(0,0,0,.35);
                                    box-shadow:0 6px 16px rgba(255,207,92,.35), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.2);
                                }
                                .btn, .choice-card{touch-action:manipulation}
                                
                                .controls-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
                                
                                #match.card{display:grid;grid-template-columns:1fr 80px 1fr;gap:14px;align-items:center;margin-top:14px}
                                
                                #championPanel .choice-card {
                                    width:100%;
                                    max-width:320px;
                                    margin:0 auto;
                                    border-color:var(--gold);
                                    box-shadow:0 0 0 2px rgba(255,207,92,.35), 0 0 30px rgba(255,207,92,.25);
                                }
                                #championPanel {
                                    overflow:hidden;
                                    border-top-color:var(--gold);
                                    box-shadow:0 14px 34px rgba(255,207,92,.25), inset 0 1px 0 rgba(255,255,255,.05);
                                }
                                #championPanel .section-title::before{background:var(--gold);box-shadow:0 0 8px rgba(255,207,92,.8)}
                                #championPanel .section-title::after{content:"🏆";margin-left:2px}

                                /* Poké Ball "VS" divider */
                                .vs{display:flex;align-items:center;justify-content:center}
                                .vs::before{
                                    content:"";
                                    display:block;
                                    width:44px;height:44px;border-radius:999px;
                                    background:
                                        radial-gradient(circle at 50% 50%, #fff 0 16%, #111 16% 21%, transparent 21%),
                                        linear-gradient(#e3350d 0 48%, #111 48% 52%, #fff 52% 100%);
                                    border:2px solid #111;
                                    box-shadow:0 4px 12px rgba(0,0,0,.45);
                                }
                                .vs-label{
                                    font-family:var(--display-font);
                                    font-size:11px;
                                    color:var(--pokedex-red-light);
                                    letter-spacing:1px;
                                    text-shadow:0 0 6px rgba(227,53,13,.6);
                                }
                                .vsCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
                                #bothWinBtn{font-size:11px;padding:6px 8px;white-space:nowrap}
                                
                                .panel{margin-top:16px}
                                
                                #historyList{border:1px solid var(--line);border-radius:14px;padding:10px;max-height:320px;overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}
                                #historyPanel.card h3,#championPanel.card h3{margin:8px 0 8px}
                                .history-row{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
                                .history-row .winner{color:var(--gold);font-weight:800;text-align:right;text-shadow:0 0 8px rgba(255,207,92,.35)}
                                .history-row > div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
                                .history-row .vs{justify-self:center}
                                /* Explicit placement so VS never gets pushed off row */
                                .history-row{
                                  grid-template-areas: "left vs right winner";
                                }
                                .history-row > :nth-child(1){grid-area:left}
                                .history-row > :nth-child(2){grid-area:vs}
                                .history-row > :nth-child(3){grid-area:right}
                                .history-row > :nth-child(4){grid-area:winner}
                                
                                #pairInfo{margin-left:8px;color:var(--muted)}
                                
                                select, input[type="checkbox"]{accent-color:var(--accent)}
                                select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
                                select:focus, input:focus-visible, .btn:focus-visible{outline:2px solid var(--pokedex-red);outline-offset:2px}

                                .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

                                .kbd-hint{margin:4px 2px 0; font-size:12px}
                                .kbd{display:inline-block; padding:2px 7px; border-radius:6px; background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03)); border:1px solid var(--chrome); font-weight:800; box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 2px 4px rgba(0,0,0,.3)}
                                
                                @media (max-width:800px){
                                    .wrap{padding:12px}
                                    #match.card{grid-template-columns:1fr 56px 1fr}
                                    .choice-card{min-height:150px}
                                }

                                @media (max-width:700px){
                                  .wrap{padding:10px}
                                  .controls-row{gap:8px}
                                  .btn{padding:12px 16px;font-size:16px}
                                  /* REMOVED THE CONFLICTING PADDING RULE HERE */
                                  .choice-card{min-height:160px;}
                                  #filters.card{gap:12px}
                                }

                                @media (max-width:560px){
                                  /* Stack the match area vertically */
                                  #match.card{grid-template-columns:1fr;gap:10px}
                                  #leftName{order:1}
                                  .vsCol{order:2;margin:-2px auto 4px}
                                  #rightName{order:3}
                                  .kbd-hint{font-size:11px}
                                }

                                @media (max-width:420px){
                                  h3.section-title{font-size:16px}
                                  .btn{font-size:15px}
                                  #championPanel .choice-card{max-width:260px}
                                }
                            </style>
                        </head>
    <body>
        <div id="ui" class="wrap">
            <div class="pokedex-header">
                <div class="pokedex-lights" aria-hidden="true">
                    <span class="light light-main"></span>
                    <span class="light light-red"></span>
                    <span class="light light-yellow"></span>
                    <span class="light light-green"></span>
                </div>
                <h1 class="app-title"><span class="pokeball-icon" aria-hidden="true"></span>Pokémon Bracket</h1>
            </div>
            <div id="filters" class="card" style="margin-top:10px">
                <h3 class="section-title">Filters</h3>
                <div id="exRow" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <span style="font-weight:600">Exclude:</span>
                    <label class="check"><input type="checkbox" id="exMega" checked> Mega</label>
                    <label class="check"><input type="checkbox" id="exGmax" checked> Gmax</label>
                    <label class="check"><input type="checkbox" id="exCostume" checked> Costumes</label>
                    <label class="check"><input type="checkbox" id="exAltForms" checked> Alt forms</label>
                </div>
                <div id="genRow" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <label for="genSelect" class="label">Generation:</label>
                    <select id="genSelect">
                        <option value="">All</option>
                        <option value="generation-i">Gen 1</option>
                        <option value="generation-ii">Gen 2</option>
                        <option value="generation-iii">Gen 3</option>
                        <option value="generation-iv">Gen 4</option>
                        <option value="generation-v">Gen 5</option>
                        <option value="generation-vi">Gen 6</option>
                        <option value="generation-vii">Gen 7</option>
                        <option value="generation-viii">Gen 8</option>
                        <option value="generation-ix">Gen 9</option>
                    </select>
                    <label for="regionSelect" class="label">Region:</label>
                    <select id="regionSelect">
                        <option value="">All</option>
                    </select>
                </div>
                <div id="typeRow" style="display:flex;gap:10px;align-items:center;position:relative">
                    <label for="typeDropdownBtn" class="label">Types:</label>
                    <button id="typeDropdownBtn" class="btn secondary" type="button" style="padding:6px 10px">Select Types</button>
                    <div id="typeDropdown" style="display:none;position:absolute;top:100%;left:0;margin-top:6px;z-index:20;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)">
                        <div id="typeBox" style="display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:6px;max-width:320px">
                            <label class="check"><input type="checkbox" name="typeOpt" value="normal"> Normal</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="fire"> Fire</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="water"> Water</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="electric"> Electric</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="grass"> Grass</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="ice"> Ice</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="fighting"> Fighting</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="poison"> Poison</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="ground"> Ground</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="flying"> Flying</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="psychic"> Psychic</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="bug"> Bug</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="rock"> Rock</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="ghost"> Ghost</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="dragon"> Dragon</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="dark"> Dark</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="steel"> Steel</label>
                            <label class="check"><input type="checkbox" name="typeOpt" value="fairy"> Fairy</label>
                        </div>
                    </div>
                    <div style="margin-top:8px">
                        <label class="check" style="gap:8px"><input type="checkbox" id="typesModeAll">Strict Typing</label>
                    </div>
                </div>
                
                <div id="specialRow" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                    <span style="font-weight:600">Special:</span>
                    <label class="check"><input type="checkbox" id="onlyLegendary"> Legendary</label>
                    <label class="check"><input type="checkbox" id="onlyMythical"> Mythical</label>
                    <label class="check"><input type="checkbox" id="onlyMega"> Mega</label>
                    <label class="check"><input type="checkbox" id="onlyGmax"> Gmax</label>
                    <label class="check"><input type="checkbox" id="onlyStarters"> Starters</label>
                    <label id="starterStageWrap" class="check" style="display:none;align-items:center;gap:6px">
                        Stage:
                        <select id="starterStage" disabled>
                            <option value="all">All</option>
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                        </select>
                    </label>
                </div>
                
                <div style="display:flex;flex-direction:column;gap:6px;margin-left:0">
                    <span id="filterCount" class="muted"></span>
                </div>
            </div>
            
            <div class="controls-row" style="margin-bottom:6px">
                <button id="startBtn" class="btn">Start Bracket</button>
                <label class="check" style="margin-left:6px">
                    <input type="checkbox" id="autoShuffleChk">Auto-shuffle each round
                </label>
            </div>
            <div class="controls-row">
                <button id="undoBtn" class="btn secondary" disabled>Undo</button>
                <button id="shuffleBtn" class="btn secondary" disabled>Shuffle Remaining</button>
                <span id="pairInfo" class="muted" aria-live="polite"></span>
            </div>
            <div class="kbd-hint muted">Shortcuts:
                <span class="kbd">←</span>/<span class="kbd">→</span> to pick,
                <span class="kbd">B</span> for both win,
                <span class="kbd">U</span> to undo,
                <span class="kbd">S</span> to shuffle
            </div>

            <div id="match" class="card">
                <button id="leftName"  class="choice-card" type="button"></button>
                <div class="vsCol">
                    <div class="vs"></div>
                    <span class="vs-label">VS</span>
                    <button id="bothWinBtn" class="btn special" type="button">Both Win</button>
                </div>
                <button id="rightName" class="choice-card" type="button"></button>
            </div>
            <div id="championPanel" class="card panel" style="display:none">
                <h3 class="section-title">Champion</h3>
                <div id="championCard" class="choice-card"></div>
            </div>
            <div id="historyPanel" class="card panel">
                <h3 class="section-title">Match History</h3>
                <div id="historyList" role="log" aria-live="polite"></div>
            </div>
        </div>
    </body>
    <script>
        //load JSON
        let pokemonData = []
        let pokedexes = {};
        
        let regionIndex = new Map();
        
        function buildDexIndexes() {
            regionIndex = new Map();
            const values = Object.values(pokedexes || {});
            for (const dex of values) {
                if (!dex || !Array.isArray(dex.entries)) continue;
                const region = (dex.region || '').toLowerCase();
                for (const ent of dex.entries) {
                    const name = (ent.species_name || (Array.isArray(ent) ? ent[2] : '') || '').toLowerCase();
                    if (!name) continue;
                    if (region) {
                        if (!regionIndex.has(region)) regionIndex.set(region, new Set());
                        regionIndex.get(region).add(name);
                    }
                }
            }
        }
        
        async function loadData() {
            try {
                // Fetch both files concurrently instead of one after another —
                // halves the network-bound part of startup on a cold load.
                const [pokeRes, dexRes] = await Promise.all([
                    fetch('pokemon.json'),
                    fetch('pokedexes.json')
                ]);
                if (!pokeRes.ok) throw new Error(`pokemon.json failed to load (HTTP ${pokeRes.status})`);
                if (!dexRes.ok) throw new Error(`pokedexes.json failed to load (HTTP ${dexRes.status})`);

                const [rawPokemon, dexJson] = await Promise.all([pokeRes.json(), dexRes.json()]);

                pokemonData = rawPokemon.filter(p => (p.variety_tag || '').toLowerCase() !== 'exclude');
                pokedexes = dexJson;

                console.log("Loaded", pokemonData.length, "pokemon entries");
                console.log("Available pokedexes:", Object.keys(pokedexes));
                buildDexIndexes();
                populateRegionVersionUI();
                updateFilterCount();
            } catch (err) {
                console.error('Failed to load bracket data:', err);
                if (dom.filterCount) dom.filterCount.textContent = 'Failed to load Pokémon data — please refresh and try again.';
                if (dom.startBtn) dom.startBtn.disabled = true;
            }
        }
        
        // Cached DOM references (populated once in init(), reused across hot-path
        // functions like renderPair/renderHistory instead of re-querying every call).
        const dom = {};
        function cacheDom() {
            dom.leftName      = document.getElementById('leftName');
            dom.rightName     = document.getElementById('rightName');
            dom.pairInfo      = document.getElementById('pairInfo');
            dom.undoBtn       = document.getElementById('undoBtn');
            dom.shuffleBtn    = document.getElementById('shuffleBtn');
            dom.bothWinBtn    = document.getElementById('bothWinBtn');
            dom.championPanel = document.getElementById('championPanel');
            dom.championCard  = document.getElementById('championCard');
            dom.historyList   = document.getElementById('historyList');
            dom.filterCount   = document.getElementById('filterCount');
            dom.regionSelect  = document.getElementById('regionSelect');
            dom.startBtn      = document.getElementById('startBtn');
        }

        let workingList = [];
        let pairs = [];
        let pairIndex = 0;
        let currentRound = 1;
        let winnersThisRound = [];
        let matchHistory = [];
        let roundPairs = new Map();
        let currentFilters = {
            gen: '',
            types: [],
            typesRequireAll: false,
            excludeMega: true,
            excludeGmax: true,
            excludeCostume: true,
            excludeAltForms: true,
            onlyLegendary: false,
            onlyMythical: false,
            onlyStarters: false,
            starterStage: 'all',
            onlyMega: false,
            onlyGmax: false,
            regions: []
        };
        
        //display logic
        function populateRegionVersionUI() {
            const sel = dom.regionSelect || document.getElementById('regionSelect');
            if (!sel) return;
            sel.innerHTML = '<option value="">All</option>';
            const regions = Array.from(new Set(
                                               Object.values(pokedexes)
                                               .map(d => (d.region || '').toLowerCase())
                                               .filter(Boolean)
                                               )).sort();
                                               for (const r of regions) {
                                                   const label = r.replace(/-/g,' ');
                                                   const nice = label.charAt(0).toUpperCase() + label.slice(1);
                                                   const opt = document.createElement('option');
                                                   opt.value = r;
                                                   opt.textContent = nice;
                                                   sel.appendChild(opt);
                                               }
        }
        
        function labelOf(r) {
            if (!r) return '(unknown)';
            const v = r.variety || '';
            const s = r.species || '';
            const tag = (r.variety_tag || '').toLowerCase();
            if (currentFilters && currentFilters.excludeAltForms && tag === 'form') {
                const base = (s || v || '').replace(/-/g, ' ');
                return base ? base.charAt(0).toUpperCase() + base.slice(1) : '(unknown)';
            }
            if (v && s && v !== s && v.startsWith(s + '-')) {
                const suffix = v.slice(s.length + 1).replace(/-/g, ' ');
                const sp = s.charAt(0).toUpperCase() + s.slice(1);
                const sf = suffix.charAt(0).toUpperCase() + suffix.slice(1);
                return `${sp} (${sf})`;
            }
            const base = (v || s || '').replace(/-/g, ' ');
            return base ? base.charAt(0).toUpperCase() + base.slice(1) : '(unknown)';
        }
        
        function displayName(raw) {
            if (!raw) return '(unknown)';
            const s = String(raw);
            if (/\(.*\)/.test(s)) return s;
            const parts = s.split('-');
            return parts.map((p,i) => i === 0 ? (p.charAt(0).toUpperCase()+p.slice(1)) : p).join('-');
        }
        
        function artworkUrlFor(r) {
            if (!r || !r.variety_id) return null;
            return `./official-artwork/${r.variety_id}.png`;
        }
        
        function cardHTML(r) {
            if (!r) return '';
            const url = artworkUrlFor(r);
            const name = labelOf(r);
            const img = url ? `<img class="poke-img" src="${url}" alt="${name}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='placeholder.png';">` : '<div class="poke-img-placeholder">?</div>';

            // NEW: Generate the HTML for type icons
            // This assumes your files are at "types/fire.png", "types/water.png", etc.
            let typeIcons = '';
            if (r.types && Array.isArray(r.types)) {
                typeIcons = `<div class="poke-types">
                    ${r.types.map(t => `<img class="type-icon" src="type-sprites/${t}.png" alt="${t}">`).join('')}
                </div>`;
            }

            // Primary type drives the card's glow/border color (see .poke-card[data-type] in CSS)
            const primaryType = (Array.isArray(r.types) && r.types[0]) ? String(r.types[0]).toLowerCase() : '';
            const typeAttr = primaryType ? ` data-type="${primaryType}"` : '';

            return `<div class="poke-card"${typeAttr}>
                ${img}
                <div class="poke-name">${name}</div>
                ${typeIcons}
            </div>`;
        }
        
        function renderPair() {
            const { leftName: leftEl, rightName: rightEl, pairInfo: infoEl, undoBtn, shuffleBtn, bothWinBtn } = dom;
            undoBtn.disabled = matchHistory.length === 0;
            shuffleBtn.disabled = pairIndex >= pairs.length;

            if (pairIndex >= pairs.length) {
                leftEl.innerHTML = '';
                rightEl.innerHTML = '';
                infoEl.textContent = `Done — ${pairs.length} matches`;
                leftEl.disabled = true;
                rightEl.disabled = true;
                leftEl.setAttribute('aria-label', '');
                rightEl.setAttribute('aria-label', '');
                if (bothWinBtn) bothWinBtn.disabled = true;
                return;
            }

            const [a,b] = pairs[pairIndex];
            leftEl.innerHTML = a ? cardHTML(a) : '';
            rightEl.innerHTML = b ? cardHTML(b) : '';
            leftEl.disabled = !a;
            rightEl.disabled = !b;
            leftEl.setAttribute('aria-label', a ? `Choose ${labelOf(a)}` : 'No contestant');
            rightEl.setAttribute('aria-label', b ? `Choose ${labelOf(b)}` : 'No contestant');
            // Disable "Both Win" on the championship match (pairs.length === 1) so the
            // bracket is guaranteed to converge on a single champion instead of looping
            // the same two contestants into the next round forever.
            if (bothWinBtn) bothWinBtn.disabled = !(a && b) || pairs.length === 1;

            infoEl.textContent = `Round ${currentRound} — Match ${pairIndex + 1} of ${pairs.length}`;
        }
        
        function renderHistory() {
            const host = dom.historyList;
            if (!host) return;
            
            if (!Array.isArray(matchHistory) || matchHistory.length === 0) {
                host.innerHTML = '<div class="muted">No matches yet.</div>';
                return;
            }
            
            const byRound = new Map();
            for (const m of matchHistory) {
                if (!byRound.has(m.round)) byRound.set(m.round, []);
                byRound.get(m.round).push(m);
            }
            
            let html = '';
            const rounds = Array.from(byRound.keys()).sort((a,b) => b - a);
            for (const r of rounds) {
                html += `<div class="muted" style="margin:6px 0 4px;font-weight:800;font-family:var(--display-font);letter-spacing:.3px">Round ${r}</div>`;
                const rows = byRound.get(r).slice().reverse();
                for (const m of rows) {
                    const a = displayName(m.a);
                    const b = m.b ? displayName(m.b) : '(bye)';
                    const w = displayName(m.winner);
                    html += `<div class="history-row">
            <div style="text-align:right">${a}</div>
            <div class="vs" style="transform:scale(.8)"></div>
            <div style="text-align:left">${b}</div>
            <div class="winner">${w}</div>
         </div>`;
                }
            }
            host.innerHTML = html;
        }
        
        // Champion panel helpers
        function clearChampion() {
            const { championPanel: panel, championCard: card } = dom;
            if (panel) panel.style.display = 'none';
            if (card) card.innerHTML = '';
        }
        function showChampion(entry) {
            const { championPanel: panel, championCard: card } = dom;
            if (!panel || !card) return;
            card.innerHTML = cardHTML(entry);
            panel.style.display = '';
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        //filter logic
        function asBool(v) {
            return v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';
        }
        
        function selectedRegions() {
            const sel = dom.regionSelect;
            if (!sel) return [];
            const v = sel.value || '';
            return v ? [v.toLowerCase()] : [];
        }
        
        function applyFilters(all, f) {
            let out = all;
            if (f.gen) {
                out = out.filter(p => p.form_intro_gen === f.gen);
            }
            if (Array.isArray(f.types) && f.types.length > 0) {
                if (f.typesRequireAll) {
                    if (f.types.length === 1) {
                        const only = f.types[0];
                        out = out.filter(p => Array.isArray(p.types) && p.types.length === 1 && p.types[0] === only);
                    }
                    else {
                        out = out.filter(p => Array.isArray(p.types) && f.types.every(t => p.types.includes(t)));
                    }
                }
                else {
                    out = out.filter(p => Array.isArray(p.types) && f.types.some(t => p.types.includes(t)));
                }
            }
            if (f.onlyLegendary || f.onlyMythical || f.onlyStarters || f.onlyMega || f.onlyGmax) {
                out = out.filter(p => {
                    const tag = (p.variety_tag || '').toLowerCase();
                    const isMega = (tag === 'mega');
                    const isGmax = (tag === 'gmax');
                    let pass = false;
                    if (f.onlyLegendary && asBool(p.is_legendary)) pass = true;
                    if (f.onlyMythical && asBool(p.is_mythical)) pass = true;
                    if (f.onlyMega && isMega) pass = true;
                    if (f.onlyGmax && isGmax) pass = true;
                    if (f.onlyStarters && asBool(p.is_starter)) {
                        if (f.starterStage === 'all') pass = true;
                        else {
                            const ev = (p.starter_evo != null && p.starter_evo !=='') ? Number(p.starter_evo) : NaN;
                            if (!Number.isNaN(ev) && String(ev) === String(f.starterStage)) pass = true;
                        }
                    }
                    return pass;
                });
            }
            if (Array.isArray(f.regions) && f.regions.length) {
                const allowed = new Set();
                for (const r of f.regions) {
                    const set = regionIndex.get(String(r).toLowerCase());
                    if (set) for (const n of set) allowed.add(n);
                }
                if (allowed.size) {
                    out = out.filter(p => {
                        const key = (p.variety || p.species || '').toLowerCase();
                        return allowed.has(key);
                    });
                }
            }
            out = out.filter(p => {
                const tag = (p.variety_tag || '').toLowerCase();
                if (f.excludeMega && (tag === 'mega' || tag === 'primal')) return false;
                if (f.excludeGmax && tag === 'gmax') return false;
                if (f.excludeCostume && tag === 'costume') return false;
                if (f.excludeAltForms && tag === 'form') return false;
                return true;
            });
            return out;
        }
        
        function updateFilterCount() {
            const el = dom.filterCount;
            if (!el) return;
            const sample = applyFilters(pokemonData, currentFilters);
            el.textContent = `Matches: ${sample.length} / ${pokemonData.length}`;
        }
        
        //bracket helper functions
        let autoShuffleRounds = false;
        function shuffle(arr) {
            for (let i = arr.length -1; i>0; i--) {
                const j = Math.floor(Math.random() * (i+1));
                [arr[i],arr[j]] = [arr[j],arr[i]];
            }
            return arr;
        }
        
        function buildPairs(list) {
            const out = [];
            for (let i=0; i<list.length; i += 2) {
                const a = list[i];
                const b = list[i + 1] ?? null;
                out.push([a,b]);
            }
            return out;
        }
        
        function recordMatch(round, a, b, winner) {
            const winnerLabel = Array.isArray(winner)
                ? 'Both advance'
                : (typeof winner === 'object' ? (winner.variety || winner.species || String(winner)) : String(winner));
            matchHistory.push({
                round,
                a: (typeof a === 'object' ? (a.variety || a.species || String(a)) : String(a)),
                b: (b ? (typeof b === 'object' ? (b.variety || b.species || String(b)) : String(b)) : null),
                winner: winnerLabel, winner_obj: winner
            });
            renderHistory();
        }
        
        //bracket core logic
        function pickWinner(side) {
            if (pairIndex >= pairs.length) return;

            const [a,b] = pairs[pairIndex];

            if (side === 'both') {
                if (!b) return; // nothing to advance both of on a bye
                winnersThisRound.push(a, b);
                recordMatch(currentRound, a, b, [a, b]);
                pairIndex++;
            } else {
                let winner = a;
                if (b && side === 'right') {
                    winner = b;
                }
                winnersThisRound.push(winner);
                recordMatch(currentRound, a, b, winner);
                pairIndex++;
            }
            
            if (pairIndex >= pairs.length) {
                if (winnersThisRound.length === 1) {
                    const champ = winnersThisRound[0];
                    const champName = labelOf(champ);
                    dom.pairInfo.textContent = `Tournament complete — ${champName} wins!`;
                    dom.leftName.textContent = '';
                    dom.rightName.textContent = '';
                    showChampion(champ);
                    return;
                }
                
                const finishedRound = currentRound;
                const nextEntrants = winnersThisRound.slice();
                currentRound = finishedRound+1;
                workingList = nextEntrants;
                if (autoShuffleRounds) shuffle(workingList);
                winnersThisRound = [];
                pairs = buildPairs(workingList);
                roundPairs.set(currentRound, pairs.slice());
                pairIndex = 0;
            }
            renderPair();
        }
        
        function undoLast() {
            if (pairIndex > 0) {
                pairIndex--;
                const last = matchHistory.pop();
                const popCount = (last && Array.isArray(last.winner_obj)) ? last.winner_obj.length : 1;
                for (let i = 0; i < popCount; i++) {
                    if (winnersThisRound.length > 0) winnersThisRound.pop();
                }
                renderPair();
                renderHistory();
                return
            }
            
            if (currentRound > 1) {
                const prevRound = currentRound-1;
                const prevPairs = roundPairs.get(prevRound) || [];
                pairs = prevPairs.slice();
                currentRound = prevRound;
                
                let lastIdx = -1;
                for(let i = matchHistory.length-1;i>=0;i--) {
                    if (matchHistory[i].round === prevRound) {lastIdx = i; break;}
                }
                if (lastIdx !== -1) {
                    matchHistory.splice(lastIdx,1);
                }
                
                // NOTE: winnersThisRound can hold MORE entries than matches played
                // whenever a "both win" match contributed two winners from one match,
                // so pairIndex (which tracks matches, not winners) must be derived
                // from the match count, not winnersThisRound.length.
                const prevRoundMatches = matchHistory.filter(m => m.round === prevRound);
                winnersThisRound = prevRoundMatches
                    .flatMap(m => Array.isArray(m.winner_obj) ? m.winner_obj : [m.winner_obj])
                    .filter(Boolean);
                pairIndex = prevRoundMatches.length;
                renderPair();
                renderHistory();
                return;
            }
        }
        
        function shuffleRemaining() {
            if (!Array.isArray(pairs) || pairs.length === 0) return;
            if (pairIndex >= pairs.length) return;
            
            const remaining = [];
            for (let i = pairIndex;i<pairs.length;i++) {
                const [a,b] = pairs[i];
                if (a) remaining.push(a);
                if (b) remaining.push(b)
            }
            if (remaining.length <= 1) return;
            shuffle(remaining);
            const newRemainingPairs = buildPairs(remaining);
            const kept = pairs.slice(0,pairIndex);
            pairs = kept.concat(newRemainingPairs);
            roundPairs.set(currentRound, pairs.slice());
            renderPair();
        }
        
        async function startBracket() {
            currentRound = 1;
            winnersThisRound = [];
            matchHistory = [];
            roundPairs = new Map();
            clearChampion();
            
            workingList = applyFilters(pokemonData, currentFilters);

            if (!workingList.length) {
                if (dom.filterCount) dom.filterCount.textContent = "No Pokemon match the current filters.";
                return;
            }
            shuffle(workingList);
            if (dom.pairInfo) dom.pairInfo.textContent = '';
            
            pairs = buildPairs(workingList);
            roundPairs.set(currentRound, pairs.slice());
            pairIndex = 0;
            renderPair();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Populate the shared dom{} cache once, then wire up the buttons that
            // use it (previously each got its own getElementById call at parse time).
            cacheDom();
            dom.startBtn.addEventListener('click', startBracket);
            dom.undoBtn.addEventListener('click', undoLast);
            dom.shuffleBtn.addEventListener('click', shuffleRemaining);
            dom.leftName.addEventListener('click', () => pickWinner('left'));
            dom.rightName.addEventListener('click', () => pickWinner('right'));
            dom.bothWinBtn.addEventListener('click', () => pickWinner('both'));

            const $ = (id) => document.getElementById(id);

            // Cache controls
            const filtersHost   = $('filters');
            const genSelect     = $('genSelect');
            const typeBox       = $('typeBox');
            const typesModeAll  = $('typesModeAll');
            
            const exMega        = $('exMega');
            const exGmax        = $('exGmax');
            const exCostume     = $('exCostume');
            const exAltForms    = $('exAltForms');
            
            const onlyMega      = $('onlyMega');
            const onlyGmax      = $('onlyGmax');
            const onlyLegendary = $('onlyLegendary');
            const onlyMythical  = $('onlyMythical');
            const onlyStarters  = $('onlyStarters');
            const starterStage  = $('starterStage');
            
            // Helper to read selected types
            const getSelectedTypes = () => Array.from(document.querySelectorAll('input[name="typeOpt"]:checked')).map(el => el.value);
            
            function syncOnlyExclude() {
                if (onlyMega && onlyMega.checked) { currentFilters.excludeMega = false; if (exMega) exMega.checked = false; }
                if (onlyGmax && onlyGmax.checked) { currentFilters.excludeGmax = false; if (exGmax) exGmax.checked = false; }
            }
            
            function readFiltersFromUI() {
                currentFilters.gen              = genSelect ? (genSelect.value || '') : '';
                currentFilters.types            = getSelectedTypes();
                currentFilters.typesRequireAll  = !!(typesModeAll && typesModeAll.checked);
                
                currentFilters.excludeMega      = !!(exMega && exMega.checked);
                currentFilters.excludeGmax      = !!(exGmax && exGmax.checked);
                currentFilters.excludeCostume   = !!(exCostume && exCostume.checked);
                currentFilters.excludeAltForms  = !!(exAltForms && exAltForms.checked);
                
                currentFilters.onlyMega         = !!(onlyMega && onlyMega.checked);
                currentFilters.onlyGmax         = !!(onlyGmax && onlyGmax.checked);
                currentFilters.onlyLegendary    = !!(onlyLegendary && onlyLegendary.checked);
                currentFilters.onlyMythical     = !!(onlyMythical && onlyMythical.checked);
                currentFilters.onlyStarters     = !!(onlyStarters && onlyStarters.checked);
                currentFilters.starterStage     = starterStage ? (starterStage.value || 'all') : 'all';
                
                currentFilters.regions       = selectedRegions();
                
                const stageWrap = document.getElementById('starterStageWrap');
                if (stageWrap) stageWrap.style.display = currentFilters.onlyStarters ? 'flex' : 'none';
                if (starterStage) starterStage.disabled = !currentFilters.onlyStarters;
                
                syncOnlyExclude();
                
                updateFilterCount();
            }
            
            if (filtersHost) {
                filtersHost.addEventListener('change', (e) => {
                    readFiltersFromUI();
                });
            }
            
            readFiltersFromUI();
            
            // Types dropdown toggle logic
            const typeDropdownBtn = $('typeDropdownBtn');
            const typeDropdown    = $('typeDropdown');
            if (typeDropdownBtn && typeDropdown) {
                typeDropdownBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const open = typeDropdown.style.display === 'block';
                    typeDropdown.style.display = open ? 'none' : 'block';
                });
                document.addEventListener('click', (e) => {
                    if (!typeDropdown.contains(e.target) && e.target !== typeDropdownBtn) {
                        typeDropdown.style.display = 'none';
                    }
                });
            }
            
            const autoShuffleChk = document.getElementById('autoShuffleChk');
            if (autoShuffleChk) {
                autoShuffleChk.addEventListener('change', () => {
                    autoShuffleRounds = !!autoShuffleChk.checked;
                });
            }

            loadData();
        });

        //keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            const tag = (document.activeElement && document.activeElement.tagName) ? document.activeElement.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'select' || tag === 'textarea' || (document.activeElement && document.activeElement.isContentEditable)) {
                return;
            }
            
            switch (e.key) {
                case 'ArrowLeft':
                e.preventDefault();
                if (Array.isArray(pairs) && pairIndex < pairs.length) pickWinner('left');
                break;
                case 'ArrowRight':
                e.preventDefault();
                if (Array.isArray(pairs) && pairIndex < pairs.length) pickWinner('right');
                break;
                case 'b':
                case 'B':
                e.preventDefault();
                if (Array.isArray(pairs) && pairIndex < pairs.length) pickWinner('both');
                break;
                case 'u':
                case 'U':
                e.preventDefault();
                undoLast();
                break;
                case 's':
                case 'S':
                e.preventDefault();
                shuffleRemaining();
                break;
                default:
                break;
            }
        });
    </script>
